[package]
name = "pos"
version = "0.1.0"
description = "Blue POS - kucuk satislar icin nokta satis programi"
authors = ["Mandic"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Birim testlerinin asenkron olmasını sağlar; tauri zaten tokio kullanır,
# bu yüzden yeni bir çalışma zamanı eklenmez.
tokio = { version = "1", features = ["macros", "rt"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
# Aynı sürücü ve havuzla çalışmak için özellikler plugin ile birebir aynı tutulur.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
